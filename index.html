<script>/* x86-32 simulator core: assembler + CPU + memory + syscalls. No DOM, no network. */
(function(root){'use strict';

const wrap=(v,s)=>((v%P[s])+P[s])%P[s],sx=(v,s)=>v>=SG[s]?v-P[s]:v;

const R32=['eax','ecx','edx','ebx','esp','ebp','esi','edi'];

const CC={};const def=(n,fn)=>n.split(' ').forEach(x=>CC[x]=fn);

def('le ng',f=>f.zf||f.sf!==f.of);def('a nbe',f=>!f.cf&&!f.zf);def('ae nb nc',f=>!f.cf);def('b nae c',f=>f.cf);def('be na',f=>f.cf||f.zf);
def('s',f=>f.sf);def('ns',f=>!f.sf);def('o',f=>f.of);def('no',f=>!f.of);def('p pe',f=>f.pf);def('np po',f=>!f.pf);
const A2='mov movzx movsx lea add adc sub sbb and or xor cmp test xchg shl sal shr sar'.split(' ');

const A0='nop hlt cdq cld std clc stc stosb stosw stosd movsb movsw movsd lodsb lodsw lodsd'.split(' ');

/* ---------- expressions ---------- */
function ev(s,sym,dol){

  if(a!==undefined||b!==undefined){const q=a!==undefined?a:b;let v=0;for(let i=0;i<q.length;i++)v+=q.charCodeAt(i)*Math.pow(2,8*i);return'('+v+')';}
  if(m==='$')return'('+dol+')';
  if(/^0x/i.test(m)||/^[0-9][0-9a-f]*h$/i.test(m))return'('+parseInt(m.replace(/h$/i,''),16)+')';
  if(/^[01]+b$/i.test(m))return'('+parseInt(m,2)+')';

function calc(t){const tk=t.match(/<<|>>|[()+\-*\/%&|^~]|\d+/g)||[];let p=0;const pk=()=>tk[p],nx=()=>tk[p++];

 const bin=(sub,ops)=>()=>{let v=sub();while(ops.includes(pk())){const o=nx(),r=sub();v=o==='+'?v+r:o==='-'?v-r:o==='*'?v*r:o==='/'?Math.trunc(v/r):o==='%'?v%r:o==='<<'?v<<r:o==='>>'?v>>r:o==='&'?v&r:o==='|'?v|r:v^r;}return v;};
 const mul=bin(un,['*','/','%']),add=bin(mul,['+','-']),sh=bin(add,['<<','>>']),an=bin(sh,['&']),xr=bin(an,['^']),or=bin(xr,['|']);
 const v=or();if(p!==tk.length)throw 0;return v;}
function strip(l){let q=null,o='';for(const c of l){if(q){o+=c;if(c===q)q=null;}else if(c==="'"||c==='"'){q=c;o+=c;}else if(c===';')break;else o+=c;}return o.trim();}
function split(s){const r=[];let q=null,d=0,cur='';for(const c of s){if(q){cur+=c;if(c===q)q=null;continue;}
 if(c==="'"||c==='"'){q=c;cur+=c;continue;}if(c==='('||c==='[')d++;if(c===')'||c===']')d--;

  else if(u===1&&STR.test(a)){for(const c of a.slice(1,-1))out.push(c.charCodeAt(0)&255);}
  else{const v=a==='?'?0:wrap(ev(a,sym,dol),u);for(let i=0;i<u;i++)out.push(Math.floor(v/Math.pow(256,i))%256);}}}

 s=s.trim().replace(/^(short|near|far)\s+/i,'');let sz=0,m=s.match(/^(byte|word|dword)\s+(?:ptr\s+)?(.*)$/i);

  while((q=re.exec(b[1]))){const sg=q[1]==='-'?-1:1,tk=q[2].trim();
   if((sm=tk.match(/^(\w+)\s*\*\s*(\d+)$/))&&regInfo(sm[1])){o.x=regInfo(sm[1]);o.sc=+sm[2];}
   else if((sm=tk.match(/^(\d+)\s*\*\s*(\w+)$/))&&regInfo(sm[2])){o.x=regInfo(sm[2]);o.sc=+sm[1];}
   else if(sg>0&&regInfo(tk)){const r=regInfo(tk);if(!o.b)o.b=r;else if(!o.x)o.x=r;else throw new Error('invalid memory operand');}

/* ---------- assembler ---------- */
function assemble(src){
 const errs=[],sym={},raw=[],items=[],macros=new Map();let sec='text',dpos=0;

 lines.forEach((l0,li)=>{const ln=li+1;try{
  let l=strip(l0),m;for(const[k,v]of macros)l=l.replace(new RegExp('\\b'+k+'\\b','g'),v);if(!l)return;
  if((m=l.match(/^%assign\s+(\w+)\s+(.*)$/i))){sym[m[1].toLowerCase()]=ev(m[2],sym,0);return;}
  if((m=l.match(/^%define\s+(\w+)\s+(.*)$/i))){macros.set(m[1],m[2]);return;}
  if(/^(global|extern|bits|default|cpu|\.model|\.stack|\.386)/i.test(l))return;
  if((m=l.match(/^(?:section|segment)\s*\.?(\w+)/i))){sec=m[1].toLowerCase();return;}
  let label=null,rest=l;const DIR='(?:equ|db|dw|dd|resb|resw|resd|times)';

  else if((m=l.match(new RegExp('^([A-Za-z_.@?][\\w.@$?]*)\\s+('+DIR+'\\b.*)$','i')))&&!new RegExp('^'+DIR+'$','i').test(m[1])){label=m[1];rest=m[2];}

/* ---------- CPU ---------- */
class CPU{

<script>
const X=window.X86,$=id=>document.getElementById(id),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const src=$('src'),pre=$('pre'),gut=$('gut');
let cpu=null,dirty=true,running=false,timer=null,paused=false,cur=0,prevR=null,tab='out',errs=[],bps=new Set(),errLines=new Set(),conHtml='',memAddr=X.DB;
const REGS='e?[abcd]x|[abcd][lh]|e?[sd]i|e?[sb]p|eip',INS='mov|movzx|movsx|lea|add|adc|sub|sbb|inc|dec|mul|imul|div|idiv|and|or|xor|not|neg|shl|sal|shr|sar|cmp|test|jmp|j[a-z]{1,3}|call|ret|push|pop|nop|hlt|int|loop|xchg|cdq|cld|std|clc|stc|rep|repe|repne|stos[bwd]|movs[bwd]|lods[bwd]';
const RE=new RegExp(`(;.*$)|('[^']*'|"[^"]*")|(^\\s*[\\w.$@]+:)|\\b(${REGS})\\b|(\\b0x[0-9a-f]+\\b|\\b[0-9][0-9a-f]*h\\b|\\b[01]+b\\b|\\b\\d+\\b)|(%\\w+|\\b(?:section|segment|global|extern|equ|times|db|dw|dd|resb|resw|resd|byte|word|dword|ptr|offset|dup)\\b)|\\b(${INS})\\b`,'gi');
const hl=l=>esc(l).replace(RE,(m,c,s,lb,r,n,d,i)=>c?`<span class=c>${m}</span>`:s?`<span class=s>${m}</span>`:lb?`<span class=lb>${m}</span>`:r?`<span class=r>${m}</span>`:n?`<span class=n>${m}</span>`:d?`<span class=d>${m}</span>`:`<span class=k>${m}</span>`);
function paint(){const L=src.value.split('\n');
 pre.innerHTML=L.map((l,i)=>`<div class="l${cur===i+1?' cur':''}${errLines.has(i+1)?' er':''}">${hl(l)||' '}</div>`).join('');
 gut.innerHTML=L.map((_,i)=>`<div class="${bps.has(i+1)?'bp':''}${cur===i+1?' cur':''}" data-l="${i+1}" title="Click: toggle breakpoint">${i+1}</div>`).join('');sync();}
const sync=()=>{pre.style.transform=`translate(${-src.scrollLeft}px,${-src.scrollTop}px)`;gut.scrollTop=src.scrollTop;};
src.addEventListener('scroll',sync);
src.addEventListener('input',()=>{dirty=true;errLines.clear();paint();setStatus();});
src.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ');}});
gut.addEventListener('click',e=>{const l=+e.target.dataset.l;if(l){bps.has(l)?bps.delete(l):bps.add(l);paint();}});
/* ---------- logging ---------- */
function log(m,k=''){conHtml+=`<div class="${k}"><span class=dim>${new Date().toLocaleTimeString()}</span> ${esc(m)}</div>`;$('p-con').innerHTML=conHtml;$('p-con').scrollTop=1e9;}
function setStatus(){let t='Ready',c='var(--dim)';
 if(errs.length&&(!cpu||cpu.status==='error')&&!running){t='Error';c='var(--bad)';}else if(running){t='Running';c='var(--ok)';}
 else if(dirty){t=cpu?'Modified – re-assemble':'Not assembled';c='var(--warn)';}
 else if(cpu&&cpu.status==='error'){t='Error';c='var(--bad)';}else if(cpu&&cpu.halted){t=cpu.status==='exited'?`Exited (code ${cpu.exitCode})`:'Halted (HLT)';c='var(--acc)';}
 else if(paused){t='Paused';c='var(--warn)';}else if(cpu){t=cpu.steps?'Stopped (stepping)':'Assembled – ready';c='var(--ok)';}
 $('stt').textContent=t;$('dot').style.background=c;
 $('bP').disabled=!running;for(const b of['bA','bR','bS','bC'])$(b).disabled=running;}
/* ---------- assemble / control ---------- */
function doAssemble(){const res=X.assemble(src.value);errs=res.errors.map(e=>({line:e.line,msg:e.msg,k:'assemble'}));errLines=new Set(errs.map(e=>e.line));
 if(!res.ok){cpu=null;dirty=true;log(`Assembly failed: ${errs.length} error(s)`,'e');tabTo('err');render();return false;}
 cpu=new X.CPU(res.prog);cpu.stdin=$('stdin').value;cpu.limit=+$('lim').value||1e6;dirty=false;prevR=null;
 log(`Assembled OK: ${res.prog.ins.length} instructions, ${res.prog.image.length} data bytes, entry 0x${X.hex(res.prog.entry)}`,'o');render();return true;}
const ensure=()=>(!dirty&&cpu)||doAssemble();
function fail(e){running=false;clearTimeout(timer);errs.push({line:e.line,msg:e.message,k:'runtime'});if(e.line)errLines.add(e.line);log(`Runtime error${e.line?' (line '+e.line+')':''}: ${e.message}`,'e');tabTo('err');}
function stepOnce(){if(!ensure())return;if(cpu.halted){log('Program already finished – press Reset or Run to restart.','w');return;}
 cpu.limit=+$('lim').value||1e6;prevR=cpu.r.slice();try{cpu.step();}catch(e){fail(e);}render();}
function loop(){if(!running)return;const m=$('sp').value,per=m==='max'?20000:1,dl=m==='slow'?500:m==='fast'?20:0;
 try{for(let i=0;i<per&&!cpu.halted;i++){prevR=cpu.r.slice();cpu.step();const I=cpu.prog.ins[(cpu.ip-X.TB)/4];
  if(!cpu.halted&&I&&bps.has(I.ln)){running=false;paused=true;log(`Breakpoint at line ${I.ln}`,'w');}if(!running)break;}}catch(e){fail(e);}
 if(cpu.halted&&running){running=false;log(`Program finished: ${cpu.status}${cpu.exitCode!==null?' (exit code '+cpu.exitCode+')':''}, ${cpu.steps} instructions`,'o');}
 render();if(running)timer=setTimeout(loop,dl);}
function start(){cpu.limit=+$('lim').value||1e6;running=true;paused=false;setStatus();loop();}
function pause(){if(!running)return;running=false;paused=true;clearTimeout(timer);log('Paused','w');render();}
function reset(){running=false;paused=false;clearTimeout(timer);errs=errs.filter(e=>e.k==='assemble'&&dirty);errLines=new Set(errs.map(e=>e.line));
 if(cpu&&!dirty){cpu.reset();cpu.stdin=$('stdin').value;prevR=null;log('Reset: CPU, memory, stack and output restored to initial state.');}render();}
$('bA').onclick=()=>doAssemble();
$('bR').onclick=()=>{running=false;clearTimeout(timer);if(doAssemble()){log('Run (from start)');start();}};
$('bS').onclick=stepOnce;
$('bC').onclick=()=>{if(!ensure())return;if(cpu.halted){log('Program finished – press Reset or Run.','w');return;}log('Continue');start();};
$('bP').onclick=pause;$('bX').onclick=reset;
$('bK').onclick=()=>{src.value='';dirty=true;cpu=null;errs=[];errLines.clear();bps.clear();cur=0;render();paint();};
$('bT').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';};
$('stdin').oninput=()=>{if(cpu)cpu.stdin=$('stdin').value;};
const exs=window.EXAMPLES;$('ex').innerHTML='<option value="">Load example…</option>'+exs.map((e,i)=>`<option value="${i}">${esc(e.name)}</option>`).join('');
$('ex').onchange=e=>{if(e.target.value==='')return;running=false;clearTimeout(timer);src.value=exs[+e.target.value].code;dirty=true;cpu=null;errs=[];errLines.clear();bps.clear();log('Loaded: '+exs[+e.target.value].name);e.target.value='';render();paint();};
/* ---------- rendering ---------- */
const TABS=[['out','Output'],['con','Console'],['his','History'],['stk','Stack'],['mem','Memory'],['err','Errors']];
function tabTo(t){tab=t;renderTabs();}
function renderTabs(){$('tabs').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${n}${k==='err'&&errs.length?` (${errs.length})`:''}</button>`).join('');
 for(const[k]of TABS)$('p-'+k).classList.toggle('on',k===tab);renderPane();}
$('tabs').onclick=e=>{if(e.target.dataset.t)tabTo(e.target.dataset.t);};
const rb=a=>{try{return cpu.rdm(a,1);}catch(e){return null;}};
function renderPane(){const c=cpu;
 if(tab==='out')$('out').textContent=c?c.out:'';
 else if(tab==='his')$('p-his').innerHTML=!c||!c.hist.length?'<span class=dim>No instructions executed yet.</span>':'<table><tr class=dim><th>#<th>Line<th>Instruction<th>State changes</tr>'+c.hist.slice(-200).reverse().map(h=>`<tr><td>${h.n}<td>${h.ln}<td>${esc(h.text)}<td class=dim>${esc(h.ch.join('   ')||'–')}</tr>`).join('')+'</table>';
 else if(tab==='stk'){if(!c){$('p-stk').innerHTML='<span class=dim>Assemble a program first.</span>';return;}const esp=c.r[4],ebp=c.r[5];
  let h=`<div class=dim>ESP=0x${X.hex(esp)}  EBP=0x${X.hex(ebp)}  (stack grows downward; base 0x${X.hex(X.STOP)})</div>`;
  if(esp>=X.STOP)h+='<div class=dim>(stack empty)</div>';else for(let a=esp;a+4<=X.STOP&&a<esp+512;a+=4){h+=`<div>${X.hex(a)}:  ${X.hex(c.rdm(a,4))}${a===esp?'  ← ESP':''}${a===ebp?'  ← EBP':''}</div>`;}
  $('p-stk').innerHTML=h;}
 else if(tab==='mem')renderMem();
 else if(tab==='err')$('p-err').innerHTML=errs.length?errs.map(e=>`<div class=e>[${e.k}] ${e.line?'Line '+e.line+': ':''}${esc(e.msg)}</div>`).join(''):'<span class=dim>No errors.</span>';}
function renderMem(){if(!cpu){$('memv').innerHTML='<span class=dim>Assemble a program first.</span>';return;}
 const sz=+$('msz').value,base=(memAddr>>>0)-((memAddr>>>0)%16);let h='<span class=dim>Address   '+Array.from({length:16/sz},(_,i)=>('+'+(i*sz).toString(16)).padEnd(sz*2+1)).join('')+' ASCII</span>\n';
 for(let row=0;row<16;row++){const a=base+row*16;let cells='',asc='';
  for(let c=0;c<16;c+=sz){const bs=[];for(let k=0;k<sz;k++)bs.push(rb(a+c+k));cells+=(bs.includes(null)?'--'.repeat(sz):bs.reverse().map(b=>X.hex(b,2)).join(''))+' ';}
  for(let c=0;c<16;c++){const b=rb(a+c);asc+=b===null?'·':b>=32&&b<127?esc(String.fromCharCode(b)):'.';}
  h+=`${X.hex(a)}  ${cells} ${asc}\n`;}$('memv').innerHTML=h;}
const go=()=>{const v=parseInt($('ma').value,16);if(!isNaN(v))memAddr=v;renderMem();};
$('mg').onclick=go;$('ma').onkeydown=e=>{if(e.key==='Enter')go();};$('msz').onchange=renderMem;
$('md').onclick=()=>{memAddr=X.DB;$('ma').value=X.hex(X.DB);renderMem();};$('ms').onclick=()=>{memAddr=cpu?cpu.r[4]:X.SB;$('ma').value=X.hex(memAddr);renderMem();};
$('mw').onclick=()=>{if(!cpu)return log('Assemble first.','e');try{const a=parseInt($('wa').value,16),v=parseInt($('wv').value,16),s=+$('ws').value;if(isNaN(a)||isNaN(v))throw new Error('Enter hex address and value');
 cpu.wlog=[];cpu.wrm(a,s,v>>>0);log(`Memory write: [0x${X.hex(a)}] ← 0x${X.hex(v,s*2)} (${s} byte${s>1?'s':''})`,'o');render();}catch(e){log('Memory write failed: '+e.message,'e');}};
function render(){const c=cpu;
 cur=0;if(c&&!c.halted){const I=c.prog.ins[(c.ip-X.TB)/4];if(I)cur=I.ln;}else if(c&&c.error&&c.error.line)cur=c.error.line;
 const order=[0,3,1,2,6,7,5,4],R=X.R32;
 $('regs').innerHTML=order.map(i=>{const v=c?c.r[i]:0,ch=c&&prevR&&prevR[i]!==v;return`<tr class="${ch?'ch':''}"><td><b>${R[i].toUpperCase()}</b><td class=m>${X.hex(v)}<td class="m dim">${v}</tr>`;}).join('')+`<tr><td><b>EIP</b><td class=m>${X.hex(c?c.ip:0)}<td class="m dim">line ${cur||'–'}</tr>`;
 const f=c?c.f:{};$('fl').innerHTML=['cf','pf','af','zf','sf','df','of'].map(k=>`<span class="fg${f[k]?' on':''}">${k.toUpperCase()}=${f[k]|0}</span>`).join('');
 $('efl').textContent='EFLAGS = 0x'+X.hex(c?c.flagsWord():2);$('cnt').textContent=c?c.steps:0;
 const I=c&&!c.halted&&c.prog.ins[(c.ip-X.TB)/4];$('nx').textContent=I?`line ${I.ln}: ${I.text}`:c&&c.halted?'(program finished)':'–';
 paint();if(cur){const y=(cur-1)*21;if(y<src.scrollTop||y>src.scrollTop+src.clientHeight-50)src.scrollTop=Math.max(0,y-80);sync();}
 renderTabs();setStatus();}

src.value=exs[0].code;$('ma').value=X.hex(X.DB);log('Ready. Load an example or write NASM 32-bit code, then Assemble / Run / Step.');render();
</script></body></html>
